name: CI

# Architecture doc section 15 describes the pipeline this implements: Python
# linting, Django checks, unit and integration tests, RLS isolation tests,
# Channels/WebSocket authorization tests, and dependency scanning.
#
# The RLS gate is a separate job because it needs a real PostgreSQL: SQLite has
# no row level security, so the default test job cannot verify isolation. It is
# the job that would catch a cross-tenant data leak.

on:
  push:
    branches: [main]
  pull_request:

# Cancels superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint and Django checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check . ../tests

      - name: Django system checks (production settings)
        env:
          # Non-default so an accidental dependency on the dev defaults fails
          # here rather than in someone's local environment.
          DJANGO_SECRET_KEY: ci-check-only-not-a-real-secret
          PGHOST: localhost
        run: python manage.py check --settings=config.settings.test

      - name: No pending migrations
        # Guards against a model change landing without its migration, which
        # is how the previous revision of this project shipped 63 models and
        # zero migrations.
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

  backend-tests:
    name: Backend tests (no services)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Full suite without external services
        run: python -m pytest

      - name: Confirm the PostgreSQL-gated tests actually skipped
        # If the gate silently stopped skipping, the RLS job below might be
        # the only thing covering it - so make the skip visible rather than
        # leaving it ambiguous.
        run: python -m pytest -q -m integration 2>&1 | tee pytest-integration.log

      - name: Assert no test requires PostgreSQL by default
        run: |
          if grep -qE "^(FAILED|ERROR)" pytest-integration.log; then
            echo "::error::integration tests failed without PostgreSQL; config.settings.test must stay service-free"
            exit 1
          fi

  rls-isolation:
    name: Row level security isolation gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MEDIFLOW_TEST_PGHOST: localhost
      MEDIFLOW_TEST_PGPORT: "5432"
      MEDIFLOW_TEST_PGDATABASE: mediflow
      MEDIFLOW_TEST_PGUSER: postgres
      MEDIFLOW_TEST_PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: mediflow
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: python manage.py migrate --noinput --settings=config.settings.base

      - name: Cross-tenant isolation gate
        # Every tenant-owned table is checked for a cross-tenant read, a
        # cross-tenant write and fail-closed behaviour with no context. The
        # path is relative to backend/, where the pytest rootdir lives.
        run: python -m pytest -q ../tests/integration/test_rls_isolation.py

  frontend:
    name: Frontend lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint, typecheck and test
        run: npm run check

      - name: Production build
        run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: true
          tags: mediflow-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name mediflow -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke-test-key \
            -e DJANGO_DEBUG=false \
            mediflow-backend:${{ github.sha }}
          # The liveness probe is anonymous by design, so it needs no token.
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health/; then
              echo "health probe OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy"
          docker logs mediflow
          exit 1

  dependency-scan:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict