          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - password
      - username
    OnboardTenant:
      type: object
      description: |-
        POST /tenants/onboard/ payload (TEN-010, TEN-011).

        A plain Serializer rather than a ModelSerializer on purpose: the action
        mints five kinds of rows, and a ModelSerializer would attach a
        UniqueValidator to ``slug``, answering duplicates 400 — the endpoint
        refuses them 409 as a state conflict.
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        facility:
          $ref: '#/components/schemas/FacilitySeed'
        admin:
          $ref: '#/components/schemas/OnboardAdmin'
        abdm:
          allOf:
          - $ref: '#/components/schemas/AbdmSeed'
          nullable: true
      required:
      - admin
      - facility
      - name
      - slug
    OpSlip:
      type: object
      description: |-
        JSON print contract for an OPD visit slip (REG-011, REG-012).

        A response-only serializer: every field is the denormalised value a paper
        slip shows — the patient's UHID and name, the department and facility
        display names, the token block, and the issue/visit dates. ``token`` and
        ``issued_at`` are null when the visit has no issued token (an encounter
        without a token still has a printable patient + visit core).
      properties:
        uhid:
          type: string
        patient_name:
          type: string
        token:
          allOf:
          - $ref: '#/components/schemas/OpSlipToken'
          nullable: true
        department:
          type: string
        facility:
          type: string
        issued_at:
          type: string
          format: date-time
          nullable: true
        visit_date:
          type: string
          format: date
      required:
      - department
      - facility
      - patient_name
      - uhid
      - visit_date
    OpSlipToken:
      type: object
      description: |-
        The token block of the OP slip print contract (REG-011, REG-012).

        ``series``/``number`` are printed on the paper slip verbatim; they come
        from the ``opd.Token`` row ``OpSlipView`` selects for the visit.
      properties:
        series:
          type: string
        number:
          type: integer
      required:
      - number
      - series
