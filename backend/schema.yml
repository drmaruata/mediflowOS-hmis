  /api/v1/tracking-board/:
    get:
      operationId: v1_tracking_board_retrieve
      description: |-
        ER tracking board — REST polling, not Channels (PLT-003, INT-013).

        Filtered on ``Triage.category``, the column that exists. The board used
        to filter on ``status``, which ``Triage`` does not have: its fields are
        ``tenant_id, patient_id, category, arrival_time,
        first_assessment_time, mlc_flag``. Filtering on a column that is not
        there raises ``FieldError`` out of the view, so every ``?status=``
        request answered 500 — a waiting-room board that broke the moment an ER
        nurse filtered it. ``apps/ipd/views.py``'s bed board docstring records
        the same mistake on ``facility_id``; this is that bug, second time.

        ``status`` is therefore accepted as a documented alias for ``category``
        rather than dropped: ``/api/v1/tokens/queue/`` filters on a real
        ``status`` column, and a client carrying that convention to a second
        board should get the rows it asked for, not a 500. Send both names
        with different values and the request contradicts itself — answered 400
        with a message naming the conflict, rather than silently preferring one
        and reporting a board the caller did not ask for.

        No value whitelist, on purpose: an unknown category yields an empty
        board, exactly as an unknown token status does on the queue board today.
        The column carries no ``choices``, so a list here would be a second
        source of truth that drifts the first time triage categories change.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Triage category to show (I, II, III, IV or V). This is the column
          on the model and the parameter's real name.
      - in: query
        name: status
        schema:
          type: string
        description: Alias for 'category', kept because the OPD token queue spells
          its filter 'status' and a client following that convention across the boards
          must not meet a 500 here.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Triage'
          description: ''
  /api/v1/triages/:
    get:
      operationId: v1_triages_list
      description: |-
        Scope a DRF viewset's queryset to the request's tenant.

        Applied through ``get_queryset`` rather than per-method overrides, so every
        verb - including the ones DRF generates for detail routes and ``get_object``
        - is covered by one rule.

        This is a second line of defence, not the primary control. Row level
        security in PostgreSQL is what actually enforces isolation; this mixin
        stops unscoped rows being selected in the first place, so a missing policy
        surfaces as an empty queryset rather than a cross-tenant read.

        When no tenant is resolved the queryset is empty rather than unfiltered. An
        unfiltered queryset would be the dangerous failure mode: it would look like
        a working endpoint while returning every tenant's rows.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
