  /api/v1/patients/{id}/abha/create/:
    post:
      operationId: v1_patients_abha_create_create
      description: 'Create a new ABHA for this patient through the ABDM sandbox (REG-009).
        The request body is passed through to the sandbox enrollment API verbatim;
        the sandbox create spec is unresolved, so the schema is deliberately not pinned.
        Answers 400 with code `ABDM_REQUEST_INVALID` when the body is not a JSON object,
        503 with code `ABDM_SANDBOX_UNCONFIGURED` when the sandbox is not configured,
        and 502 with code `ABDM_SANDBOX_UNREACHABLE` when it cannot be reached or
        `ABDM_REQUEST_FAILED` when the sandbox answers non-2xx or a 2xx that is not
        JSON - never a fabricated success. Tenant-scoped: a patient of another tenant
        answers 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this patient.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: The sandbox's create response, passed through verbatim. The
            create spec is unresolved (REG-009) so the exact shape is not pinned.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbdmErrorResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbdmErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbdmErrorResponse'
          description: ''
