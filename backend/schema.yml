          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
    TenantAwareToken:
      type: object
      description: Adds the tenant, facility, role, permissions and MFA claims to
        the token.
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    TenantAwareTokenRefresh:
      type: object
      description: |-
        Refuse rotation once the membership behind the token is off (TEN-008).

        Wired through ``TOKEN_REFRESH_SERIALIZER``. Tenant and permission claims
        survive rotation, so without this class an offboarded user holding a live
        refresh token would keep minting fully-claimed access tokens for
        ``REFRESH_TOKEN_LIFETIME`` and deactivation would never take effect for a
        session already in progress.
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    Token:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        patient_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        series:
          type: string
          maxLength: 32
        number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        priority:
