  /api/v1/audit-log/verify/:
    get:
      operationId: v1_audit_log_verify_retrieve
      description: Recompute this tenant's audit hash chain and report the first row
        that fails to match (AUD-002). The chain is per tenant and ordered, so the
        verdict covers only the caller's own rows. Rows written before the chain existed
        carry no digest and are skipped; a retention purge re-anchors the check on
        the oldest surviving row.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
          description: ''
  /api/v1/auth/break-glass/:
    post:
      operationId: v1_auth_break_glass_create
      description: |-
        Grants recorded emergency access to a record outside normal scope (TEN-007).

        Requires a non-empty reason, and the grant is written before access is
        allowed, so there is no path to an unlogged emergency read. Every grant
        additionally writes its AUD-001 audit row and raises the TEN-007 alert:
        a ``Notification(type="critical", title="Break-glass access granted")``
        for every *active* membership whose role demands MFA — the peers whose
        normal access is gated the hardest and who can stop the emergency read.
        Rows are persisted before the success response, so an alert can never be
        skipped by a client that retries: ``delivered`` stays False and Task 22's
        consumer flips it when it actually pushes.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakGlassRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BreakGlassRequest'
          multipart/form-data:
            schema:
