components:
  schemas:
    ABHACallback:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        request_id:
          type: string
          maxLength: 128
        facility_abdm_id:
          type: string
          maxLength: 64
        ip:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        profile:
          nullable: true
        matched_patient_id:
          type: string
          format: uuid
          nullable: true
        token_issued:
          type: string
          nullable: true
          maxLength: 64
        status:
          type: string
          maxLength: 32
        link_token_enc:
          type: string
          readOnly: true
          nullable: true
        match_candidates:
          readOnly: true
          nullable: true
      required:
      - facility_abdm_id
      - id
      - link_token_enc
      - match_candidates
      - request_id
      - status
      - tenant_id
      - timestamp
    AbdmErrorResponse:
      type: object
      description: |-
        Structured error body the ABDM ABHA actions answer (REG-009).

        Every failure shape — 400 validation misses, the 502 sandbox-unreachable
        path and both 503s — is ``{status, code, detail}``, and the whole point of
        the shape is that it is stable, so one shared component is used for all of
        them in the schema. The ``code`` values are the stable machine keys
        (``ABDM_SANDBOX_UNCONFIGURED``, ``ABHA_NOT_LINKED``, ...).
      properties:
        status:
          type: string
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
      - status
    AbdmSeed:
      type: object
      description: |-
        ABDM identifiers recorded on the first facility (TEN-011).

        Every field is optional: a hospital can board before NHA registration and
        backfill the identifiers later. ``abdm_registration_status`` defaults to
        the model's "pending" when absent.
      properties:
        abdm_hip_id:
          type: string
          maxLength: 64
        abdm_facility_id:
          type: string
          maxLength: 64
        abdm_registration_status:
          type: string
          maxLength: 32
    AbhaVerifyRequest:
      type: object
      properties:
        otp:
          type: string
      required:
      - otp
    Admission:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        patient_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        ward_id:
          type: string
          format: uuid
        bed_id:
          type: string
          format: uuid
        admission_time:
          type: string
          format: date-time
          readOnly: true
        source:
          type: string
          maxLength: 64
        diagnosis:
          type: string
          nullable: true
        responsible_clinician_id:
          type: string
          format: uuid
          nullable: true
        discharged_at:
          type: string
          format: date-time
          nullable: true
        disposition:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DispositionEnum'
          - $ref: '#/components/schemas/NullEnum'
        discharge_summary:
          type: string
          nullable: true
        transfer_from:
          type: string
          format: uuid
          nullable: true
        transfer_to:
          type: string
          format: uuid
          nullable: true
        transfer_reason:
          type: string
          nullable: true
      required:
      - admission_time
      - bed_id
      - department_id
      - id
      - patient_id
      - source
      - tenant_id
      - ward_id
    ApiHealth:
      type: object
      description: Response contract for the liveness probe.
      properties:
        status:
          type: string
        version:
          type: string
      required:
      - status
      - version
    AuditChainVerification:
      type: object
      description: |-
        Response of ``GET /audit-log/verify/`` (AUD-002).

        Declared rather than built inline so ``/api/docs/`` shows the exact shape
        the endpoint answers with: ``valid`` is the verdict, ``checked`` how many
        chained rows the pass recomputed, and ``first_bad`` the id of the row to
        look at first — ``None`` means the whole tenant chain verified.
      properties:
        valid:
          type: boolean
        checked:
          type: integer
        first_bad:
          type: string
          format: uuid
          nullable: true
      required:
      - checked
      - first_bad
      - valid
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          maxLength: 16
        entity_type:
          type: string
          maxLength: 64
        entity_id:
          type: string
          maxLength: 64
        reason:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          maxLength: 64
        source_ip:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        hash_chain:
          type: string
          maxLength: 128
      required:
      - action
      - entity_id
      - entity_type
      - id
      - occurred_at
      - tenant_id
    BaselineInput:
      type: object
      description: |-
        Baseline/manual indicator input (SET-007).

        ``value`` is validated here — a negative baseline is refused before any
        row is written (AGENTS §4 puts business rules in the serializer). ``source``
        is restricted by the model's choices; ``tenant_id`` is stamped by the
        mixin, never accepted from the body.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        indicator_source_code:
          type: string
          maxLength: 64
        period:
          type: string
          maxLength: 16
        value:
          type: number
          format: double
        source:
          $ref: '#/components/schemas/SourceEnum'
      required:
      - id
      - indicator_source_code
      - period
      - tenant_id
      - value
    Bed:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        bed_number:
          type: string
          maxLength: 32
        functional:
          type: boolean
        occupied:
          type: boolean
        active:
          type: boolean
        ward:
          type: string
          format: uuid
      required:
      - bed_number
      - id
      - tenant_id
      - ward
    BedStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        bed_id:
          type: string
          format: uuid
        ward_id:
          type: string
          format: uuid
        occupied:
          type: boolean
        patient_id:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bed_id
      - id
      - tenant_id
      - updated_at
      - ward_id
    BlankEnum:
      enum:
      - ''
    BreakGlassAccess:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
        resource_type:
          type: string
          maxLength: 64
        resource_id:
          type: string
