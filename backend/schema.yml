      - id
      - issued_at
      - number
      - patient_id
      - series
      - tenant_id
    TokenBlacklist:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    Triage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        patient_id:
          type: string
          format: uuid
        category:
          type: string
          maxLength: 16
        arrival_time:
          type: string
          format: date-time
          readOnly: true
        first_assessment_time:
          type: string
          format: date-time
          nullable: true
        mlc_flag:
          type: boolean
      required:
      - arrival_time
      - category
      - id
      - patient_id
      - tenant_id
    User:
      type: object
      description: |-
        Read shape of a tenant-managed user (TEN-008).

        ``auth.User`` carries no tenant column, so membership state is read from
        the membership joining this user to the *request's* tenant — the same
        join ``UserViewSet`` scopes its queryset with, which is why the fields
        below are membership-scoped rather than global. The password hash is
        absent by construction: ``password`` is not among ``fields``, so neither
        a read nor a create response can serialise it.

        Only ``username`` and ``email`` are writable (PATCH); ``is_active`` is
        deliberately not exposed, because deactivation is membership state
        (``UserMembership.active``), not the Django account flag — two
        overlapping deactivation paths would disagree the moment one was used.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        date_joined:
          type: string
          format: date-time
          readOnly: true
        role_id:
          type: string
          nullable: true
          readOnly: true
        facility_id:
          type: string
          nullable: true
          readOnly: true
        active:
          type: boolean
          nullable: true
          readOnly: true
      required:
      - active
      - date_joined
      - facility_id
      - id
      - role_id
      - username
    UserCreate:
      type: object
      description: |-
        Create payload for user management (TEN-008).

        Produces an ``auth.User`` and its active ``UserMembership`` in one
        transaction — see :meth:`create`. ``password`` is write-only and is
        hashed by ``create_user``; the repository rule that a password hash is
        never exposed holds by construction, since the only representation this
        serializer ever yields is :class:`UserSerializer`'s (see
        :meth:`to_representation`).
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role_id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
          nullable: true
      required:
      - password
      - role_id
      - username
    UserMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        facility_id:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
          readOnly: true
        user:
          type: integer
        tenant:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          format: uuid
      required:
      - active
      - id
      - role
      - tenant
      - user
    VitalsFlowsheet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        patient_id:
          type: string
          format: uuid
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        type:
          type: string
          maxLength: 32
        value:
          type: number
          format: double
        unit:
          type: string
          maxLength: 16
        source:
          type: string
          maxLength: 32
      required:
      - id
      - patient_id
      - recorded_at
      - source
      - tenant_id
      - type
      - unit
      - value
    Ward:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        type_tag:
          type: string
          maxLength: 64
        active:
          type: boolean
        department:
          type: string
          format: uuid
      required:
      - department
      - id
      - name
      - tenant_id
      - type_tag
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 200
        events: {}
        secret:
          type: string
          nullable: true
          maxLength: 255
        active:
          type: boolean
      required:
