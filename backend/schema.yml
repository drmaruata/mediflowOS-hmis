  /api/v1/qr-codes/{id}/regenerate/:
    post:
      operationId: v1_qr_codes_regenerate_create
      description: |-
        Rebuild ``encode_data`` from the row's own relationships (REG-013).

        A regenerate re-derives the encoding from the *stored* facility, intake
        point and department so the QR matches the department it now points at,
        stamps ``regenerated_at``, and records the change in the audit trail
        (AUD-001): an encode_data change is a queue-routing change and has to
        be traceable. The audit row is written directly to ``audit.event`` with
        the ``source`` marker because the mixin's write path cannot express a
        machine-initiated event.

        A revoked code is refused (ABD-002): see ``REVOKED_REGENERATE_DETAIL``.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this qr code.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRCode'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
  /api/v1/qr-codes/{id}/revoke/:
    post:
      operationId: v1_qr_codes_revoke_create
      description: 'Revoke this facility, counter or department QR code (ABD-002).
        The row keeps its history — a printed poster is not un-printed by a delete
        — but ``active`` goes false, ``revoked_at`` is stamped server-side and an
        AUD-001 audit row is written; the ``regenerate`` action then answers 409 so
        a withdrawn string cannot be rebuilt. The first call answers 201; a repeat
        call is the same end state, answers 200 and writes nothing more. Tenant-scoped:
        a QR code of another tenant answers 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this qr code.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
        '404':
          description: No such QR code in this tenant.
