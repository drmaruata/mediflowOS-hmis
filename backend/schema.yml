  /api/v1/patients/:
    get:
      operationId: v1_patients_list
      description: |-
        Bulk patient list — every returned row is a PHI read (AUD-001).

        The default paginated response shape is untouched: this is the
        standard list with one read event per returned row added before
        serialisation.

        ``?registered_on=YYYY-MM-DD`` narrows the collection to one local
        calendar day — the counter's default "registered today" view — and
        orders the result newest first so a paginated walk is stable. The
        ``__date`` lookup converts each timestamp to the current time zone
        under USE_TZ (Django 5.2 docs, field-lookup ``date``), so the day
        boundary is the hospital's own TIME_ZONE, not UTC's.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: registered_on
        schema:
          type: string
          format: date
        description: 'YYYY-MM-DD local-day filter: only patients whose registration
          timestamp falls on that hospital day (the configured TIME_ZONE), newest
          first.'
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientList'
          description: ''
    post:
      operationId: v1_patients_create
      description: |-
        Create a patient, appending the issued OPD token when present (REG-010).

        ``token`` is a response-level field: it is data about the intake, not
        about the patient, so it belongs next to the representation rather
        than inside it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Patient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Patient'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
