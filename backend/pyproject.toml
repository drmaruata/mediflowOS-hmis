[project]
name = "mediflow-os"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.18,<3.19",
    "django-cors-headers>=4.9,<5",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "django-otp>=1.7,<1.8",
    "drf-spectacular>=0.30,<0.31",
    "psycopg[binary]>=3.3,<3.4",
    "redis>=8.1,<9",
    "celery>=5.6,<5.7",
    "django-celery-beat>=2.9,<3",
    "channels>=4.3,<4.4",
    "channels-redis>=4.3,<4.4",
    # ASGI server required to serve the Channels consumers; a WSGI server
    # cannot run this project. Kept in step with requirements.txt.
    "daphne>=4.2,<5",
    "python-jose>=3.5,<4",
    "python-dotenv>=1.2,<2",
    "Pillow>=12.3,<13",
    "openpyxl>=3.1,<3.2",
    "reportlab>=5.0,<6",
    "httpx>=0.28,<0.29",
    "pydantic>=2.13,<3",
    "opentelemetry-sdk>=1.45,<1.46",
    "opentelemetry-instrumentation-django==0.66b0",
    "sentry-sdk>=2.71,<3",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["../tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "unit: isolated tests of individual backend behavior",
    "integration: tests across Django routing and API boundaries",
]

